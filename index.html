<main id="universe" class="universe">
  <canvas id="sky" aria-hidden="true"></canvas>

  <section class="hero" aria-labelledby="hello">
    <p class="prompt"><span aria-hidden="true"><span class="p-user">nikhil@universe</span><span class="p-dim">:~$</span> <span id="ty-cmd"></span></span></p>
    <h1 id="hello" class="headline"><span class="sr" id="hello-sr"></span><span class="dm" aria-hidden="true"><span id="ty-0"></span><br><span id="ty-1"></span></span></h1>
    <p class="bio" id="bio"></p>
    <p class="spark" aria-hidden="true"><span id="ty-2"></span><span class="colon" id="colon"><i class="c-top" id="pivot"></i><i class="c-bot" id="c-bot"></i></span></p>
    <span class="caret" id="caret" aria-hidden="true"></span>
  </section>

  <ul class="worlds" id="worlds" aria-label="Worlds — pick one to explore"></ul>

  <button type="button" class="bob" id="bob" aria-label="Pendulum — drag it, or swing it with the left and right arrow keys" aria-describedby="bob-tip"><span class="sr" id="bob-tip">A toy. Try shaking it.</span></button>

  <p class="skip-hint" id="skip-hint" aria-hidden="true">press any key to skip</p>
</main>

<!-- Terminal: the primary way to navigate. GUI clicks run the same commands. -->
<section class="term" id="term" aria-label="Terminal">
  <div class="term-bar">
    <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="term-title" id="term-title">~</span>
    <span class="term-help" id="term-help"><span class="kbd">tab</span> complete <span class="kbd">↑</span> history</span>
    <button type="button" class="term-toggle" id="term-toggle" aria-expanded="false" aria-controls="term-out"><span class="kbd">esc</span> <span id="term-toggle-lbl">close</span></button>
  </div>
  <div class="term-out" id="term-out" role="log" aria-live="polite" aria-label="Terminal output" tabindex="-1"></div>
  <p class="term-status" id="term-status" aria-hidden="true"></p>
  <form class="term-form" id="term-form" autocomplete="off">
    <label for="term-input" class="term-ps"><span id="ps-cwd">~</span><span class="ps-arrow" aria-hidden="true">❯</span><span class="sr">command</span></label>
    <div class="term-field">
      <span class="term-ghost" id="term-ghost" aria-hidden="true"></span>
      <input id="term-input" name="cmd" type="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="term-help" placeholder="type help">
    </div>
    <button type="submit" class="term-run" aria-label="Run command">↵</button>
  </form>
  <div class="chips" id="chips" aria-label="Suggested commands"></div>
</section>

<div class="controls" id="controls">
  <button type="button" class="icon-btn" id="btn-motion" aria-pressed="false" title="Pause motion"><span class="ic" aria-hidden="true">‖</span><span class="lbl sr">Pause motion</span></button>
  <button type="button" class="icon-btn" id="btn-replay" title="Replay intro"><span class="ic" aria-hidden="true">↻</span><span class="lbl sr">Replay intro</span></button>
</div>

<section class="simple" id="simple" aria-label="Simple view" hidden tabindex="-1"></section>

<section class="vault" id="vault" aria-label="Blog" hidden tabindex="-1"></section>

<div class="hud" id="hud" hidden>
  <p class="hud-top" id="hud-top"></p>
  <p class="hud-msg" id="hud-msg" role="status" aria-live="polite"></p>
  <p class="hud-help" id="hud-help"></p>
</div>
