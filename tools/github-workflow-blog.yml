# Rebuilds js/posts.js whenever Obsidian notes in blog/ change.
# Setup (later): put this site in a GitHub repo, point the Obsidian Git plugin at
# the blog/ folder (or sync your vault into it), and enable this workflow.
# If this site lives in a sub-folder of the repo, prefix the paths below.
name: blog
on:
  push:
    paths: ["blog/**", "tools/build-blog.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-blog.mjs
      - name: Commit generated posts
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add js/posts.js
          git diff --cached --quiet || git commit -m "blog: rebuild posts"
          git push
